name: Update Stock Prices

on:
  schedule:
    # Uses random minutes (e.g., :14) to avoid top-of-the-hour GitHub queue delays
    - cron: '14 13,15,17,19 * * 1-5'  # Market hours (EDT)
    - cron: '35 20 * * 1-5'           # Market close snapshot
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a Personal Access Token (PAT) if you need this push to trigger GitHub Pages builds
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch stock prices and update data.js
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          node scripts/update-prices.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.js
          if ! git diff --staged --quiet; then
            git commit -m "chore(prices): auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
